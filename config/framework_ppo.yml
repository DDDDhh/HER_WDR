proc:
  mode: 'train'
  task_path: 'flare_landing.yml'
  random_seed: 1
  max_num_workers: 10          # adjust to your server
  render_num: 0
  batch_size: 400
  max_episode: 50000
  max_time_step: 5.0e+7
  model_path: null             # set to a .pth to warm-start

  # Filled in at startup from the task config.
  max_episode_steps: null
  state_dim: null
  action_dim: null

# Hindsight Experience Replay
her:
  enable: true
  trigger_prob: 0.8            # fraction of non-success episodes to relabel
  min_steps: 5                 # skip degenerate short episodes
  min_alt_descended: 20.0      # m; skip episodes that barely flew

# PPO
agent:
  seed: 1
  has_continuous_action_space: true
  lr_actor: 2.0e-4
  lr_critic: 3.0e-4
  K_epochs: 10
  eps_clip: 0.2
  gamma: 0.97
  entropy_coef: 0.05           # encourage exploration; HER opens up new goal space
  max_grad_norm: 0.5
  lr_decay: 0.9995

  # Exploration schedule. Start wide; decay slowly because HER keeps producing
  # useful signal as long as the agent visits new heading states.
  action_std_init: 0.5
  action_std: 0.5
  action_std_decay_rate: 0.998
  min_action_std: 0.15
  action_std_decay_interval: 5

  device: 'cpu'

worker:
  id: null
  render: null

log:
  log_name: null
  model_save_interval: 10
